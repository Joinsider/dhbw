# Material 3 Expressive is alpha-only; see the note in composeApp/build.gradle.kts before bumping.
#noinspection NewerVersionAvailable
composeMaterial3 = "1.10.0-alpha05"
credentialsManager = "1.0.0"
credentialsStorage = "1.0.1"
javaKeyring = "1.0.4"
junit = "4.13.2"
