License: AGPL-3.0-or-later
AuthorName: Johannes
SourceCode: https://github.com/joinsider/dhbw
IssueTracker: https://github.com/joinsider/dhbw/issues

Name: Horb Students App
Summary: Timetable and Dualis grades app for students in Horb
Description: |-
  Unofficial app developed for students in Horb using Dualis.

  This app provides a complete overview of your daily study life:

  * Clear display of your personal timetable
  * All lectures, seminars and appointments at a glance
  * Easy navigation through the weekdays
  * Current information about room and lecturer
  * Access to your Dualis grades

RepoType: git
Repo: https://github.com/joinsider/dhbw

Builds:
  # The entry below is historical (v2.0.0 built from composeApp). Since the AGP 9 split the APK is
  # built by the androidApp module: builds of later commits need `subdir: androidApp`.
  - versionName: v2.0.1
    versionCode: 18
    commit: v2.0.0
    subdir: composeApp
    gradle:
      - release
    buildVersion:
      gradle:
        - release

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: v2.0.1
