name: Owner Review Gate

# Erzwingt: Wenn die PR NICHT von dir (OWNER_LOGIN) erstellt wurde,
# muss mindestens ein "APPROVED"-Review von dir auf dem aktuellen
# Head-Commit liegen, bevor dieser Check gruen wird.
# Dieser Check wird in einem separaten Ruleset ohne Bypass-Eintrag
# als required_status_check eingebunden -> auch der Owner selbst
# kann ihn beim Mergen fremder PRs nicht umgehen.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read
  contents: read

env:
  OWNER_LOGIN: Joinsider

jobs:
  gate:
    runs-on: ubuntu-latest
    # Bei pull_request_review-Events kommt die PR-Nummer aus dem Payload,
    # bei pull_request-Events direkt aus dem Event.
    steps:
      - name: Resolve PR context
        id: ctx
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number ?? context.payload.issue?.number;
            core.setOutput('pr_number', prNumber);

      - name: Evaluate review gate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = process.env.OWNER_LOGIN;
            const prNumber = ${{ steps.ctx.outputs.pr_number }};

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // Eigene PRs: sofort gruen
            if (pr.user.login === owner) {
              core.info(`PR wurde von ${owner} selbst erstellt - kein Review erforderlich.`);
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const headSha = pr.head.sha;

            const approved = reviews.some(r =>
              r.user.login === owner &&
              r.state === 'APPROVED' &&
              r.commit_id === headSha
            );

            if (!approved) {
              core.setFailed(
                `PR wurde von '${pr.user.login}' erstellt (z.B. Dependabot/anderer Nutzer) ` +
                `und benoetigt ein APPROVED-Review von '${owner}' auf dem aktuellen Head-Commit (${headSha}).`
              );
            } else {
              core.info(`Freigabe von ${owner} auf Head-Commit ${headSha} gefunden.`);
            }
