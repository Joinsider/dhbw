name: Deploy APT Repository to GitHub Pages

on:
  workflow_run:
    workflows: ["Build and Release Multi-Platform Packages"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-apt-repo:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Download DEB from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloads
          
          # The latest published release. Drafts are left out on purpose: a draft
          # is not released yet, and a stale draft must not replace what users get.
          LATEST_RELEASE=$(gh api repos/${{ github.repository }}/releases/latest)
          RELEASE_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')

          echo "Latest release tag: $RELEASE_TAG"

          # Find and download the deb asset
          ASSET_URL=$(echo "$LATEST_RELEASE" | jq -r '[.assets[] | select(.name | endswith(".deb"))][0].url // empty')
          ASSET_NAME=$(echo "$LATEST_RELEASE" | jq -r '[.assets[] | select(.name | endswith(".deb"))][0].name // empty')

          if [ -z "$ASSET_URL" ]; then
            echo "Error: No .deb asset found in release $RELEASE_TAG"
            exit 1
          fi
          
          echo "Downloading asset from: $ASSET_URL (saving as $ASSET_NAME)"
          
          # Download the asset
          curl -L -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/octet-stream" \
               "$ASSET_URL" -o "downloads/$ASSET_NAME"

      - name: Setup APT repository structure
        run: |
          # Copy existing apt-repo directory if it exists
          if [ -d "apt-repo" ]; then
            cp -r apt-repo public/
            # Remove any old .deb files from the copied directory (they might be LFS pointers)
            find public/pool/main -name "*.deb" -type f -delete 2>/dev/null || true
            # Remove old Packages files to ensure fresh generation
            find public/dists -name "Packages" -type f -delete 2>/dev/null || true
            find public/dists -name "Packages.gz" -type f -delete 2>/dev/null || true
          else
            mkdir -p public
          fi
          
          # Create directory structure (only amd64)
          mkdir -p public/pool/main
          mkdir -p public/dists/stable/main/binary-amd64
          
          # Copy the .deb into the pool under its Debian name, <package>_<version>_<arch>.deb.
          # `dpkg-scanpackages -a <arch>` selects files by that name, not by the control
          # file: the release asset is called dhbw-student-app-v<version>.deb, and as long
          # as it was copied under that name the Packages index came out empty.
          for f in downloads/*.deb; do
            PKG=$(dpkg-deb -f "$f" Package)
            VER=$(dpkg-deb -f "$f" Version)
            ARCH=$(dpkg-deb -f "$f" Architecture)
            if [ "$ARCH" != "amd64" ]; then
              echo "Error: $f is built for '$ARCH', this repository only serves amd64"
              exit 1
            fi
            cp "$f" "public/pool/main/${PKG}_${VER}_${ARCH}.deb"
            echo "Added pool/main/${PKG}_${VER}_${ARCH}.deb"
          done

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Generate Packages files
        run: |
          cd public
          
          dpkg-scanpackages -a amd64 pool/ > dists/stable/main/binary-amd64/Packages

          # An empty index still signs and deploys fine, and apt then reports
          # "Unable to locate package" to every user. Fail here instead.
          ENTRIES=$(grep -c '^Package: ' dists/stable/main/binary-amd64/Packages || true)
          if [ "$ENTRIES" -eq 0 ]; then
            echo "Error: dpkg-scanpackages found no package in pool/ — refusing to publish an empty repository"
            ls -l pool/main
            exit 1
          fi
          echo "Packages index has $ENTRIES entries"

          gzip -9 -k -f dists/stable/main/binary-amd64/Packages

      - name: Generate Release file
        run: |
          cd public/dists/stable

          # Hash the index files before Release exists: apt-ftparchive hashes every file in
          # the directory, and running it while appending to Release listed Release itself.
          rm -f Release Release.gpg InRelease
          apt-ftparchive release . > "$RUNNER_TEMP/release-checksums"

          cat > Release << 'EOF'
          Origin: DHBW Next
          Label: DHBW Next Repository
          Suite: stable
          Codename: stable
          Architectures: amd64
          Components: main
          Description: DHBW Next Kotlin Multiplatform Application
          EOF
          
          # Add file checksums
          cat "$RUNNER_TEMP/release-checksums" >> Release

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import

      - name: Sign Release file
        run: |
          cd public/dists/stable
          
          # Remove any existing signature files
          rm -f Release.gpg InRelease
          
          # Create Release.gpg
          echo "$GPG_PASSPHRASE" | gpg --default-key $GPG_KEY_ID \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase-fd 0 \
              --armor \
              --detach-sign \
              --output Release.gpg \
              Release
          
          # Create InRelease
          echo "$GPG_PASSPHRASE" | gpg --default-key $GPG_KEY_ID \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase-fd 0 \
              --clearsign \
              --output InRelease \
              Release

      - name: Export public GPG key
        run: |
          gpg --armor --export $GPG_KEY_ID > public/pubkey.gpg

      - name: Create index.html
        run: |
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>DHBW Next APT Repository</title>
              <style>
                  body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
                  code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; }
                  pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
              </style>
          </head>
          <body>
              <h1>DHBW Next APT Repository</h1>
              <p>Add this repository to your Debian/Ubuntu system (AMD64 only):</p>
          
              <h2>Step 1: Add GPG Key</h2>
              <pre>wget -O- https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/dhbw-next.gpg</pre>
          
              <h2>Step 2: Add Repository</h2>
              <pre>echo "deb [arch=amd64 signed-by=/usr/share/keyrings/dhbw-next.gpg] https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }} stable main" | sudo tee /etc/apt/sources.list.d/dhbw-next.list</pre>
          
              <h2>Step 3: Install / Upgrade</h2>
              <pre>sudo apt update
          sudo apt install dhbw-horb-student-app</pre>
          
              <hr>
              <p><a href="pool/">Browse packages</a> | <a href="dists/">Browse distributions</a></p>
          </body>
          </html>
          EOF

      - name: Generate directory listings
        uses: gacts/directory-listing@382b3439bf3a5787b20350780a0cc18553a47acd # v1
        with:
          target: public
          ignore: |
            **/index.html
            **/.git*

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
