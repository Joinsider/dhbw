name: Build and Release Multi-Platform Packages

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  # -- Manual trigger -----------------------------------------------------------
  # Choose how the version should be incremented before building.
  # On a PR merge the default (patch) is used automatically.
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - none
      changelog_en:
        description: 'Release notes (English)'
        required: false
        type: string
      changelog_de:
        description: 'Release notes (Deutsch)'
        required: false
        type: string

jobs:
  # -----------------------------------------------------------------------------
  # Version-bump job — runs when a PR is merged into main, or manually.
  # On PR merge the bump type defaults to "patch".
  # On workflow_dispatch the selected bump type is used.
  # Reads the current versionName from composeApp/build.gradle.kts, computes
  # the next semver in pure bash, writes it back, and commits it to the branch.
  # -----------------------------------------------------------------------------
  bump-version:
    name: Bump version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.semver.outputs.new_version }}
      new_tag: ${{ steps.semver.outputs.new_tag }}
      new_code: ${{ steps.versioncode.outputs.new_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Compute next semver
        id: semver
        run: |
          # ── Read current version (strip leading "v" if present) ──────────────
          CURRENT=$(grep -m1 'versionName' composeApp/build.gradle.kts \
            | sed -E 's/.*"v?([^"]+)".*/\1/')
          echo "Current version: $CURRENT"

          # ── Determine bump type ───────────────────────────────────────────────
          BUMP="${{ github.event.inputs.bump }}"
          if [ -z "$BUMP" ]; then
            BUMP="patch"   # default for push / merge triggers
          fi
          echo "Bump type: $BUMP"

          # ── If bump is 'none', keep current version ───────────────────────────
          if [ "$BUMP" = "none" ]; then
            echo "Skipping version bump, keeping current version: $CURRENT"
            echo "new_version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "new_tag=v$CURRENT"    >> "$GITHUB_OUTPUT"
            echo "skipped=true"         >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Pure-bash semver arithmetic ───────────────────────────────────────
          # Strip any pre-release suffix (e.g. "1.2.3-alpha.0" → "1.2.3")
          BASE=$(echo "$CURRENT" | sed -E 's/-[^+]+//')
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)

          case "$BUMP" in
            major)
              NEW="$((MAJOR + 1)).0.0" ;;
            minor)
              NEW="${MAJOR}.$((MINOR + 1)).0" ;;
            patch)
              NEW="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            premajor)
              NEW="$((MAJOR + 1)).0.0-alpha.0" ;;
            preminor)
              NEW="${MAJOR}.$((MINOR + 1)).0-alpha.0" ;;
            prepatch)
              NEW="${MAJOR}.${MINOR}.$((PATCH + 1))-alpha.0" ;;
            *)
              echo "Unknown bump type '$BUMP', falling back to patch"
              NEW="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "New version: $NEW"
          echo "new_version=$NEW"  >> "$GITHUB_OUTPUT"
          echo "new_tag=v$NEW"     >> "$GITHUB_OUTPUT"
          echo "skipped=false"     >> "$GITHUB_OUTPUT"

      - name: Bump Android versionCode
        id: versioncode
        if: steps.semver.outputs.skipped != 'true'
        run: |
          # Read the current integer versionCode
          CURRENT_CODE=$(grep -m1 'versionCode' composeApp/build.gradle.kts \
            | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/')
          NEW_CODE=$((CURRENT_CODE + 1))
          echo "versionCode: $CURRENT_CODE → $NEW_CODE"
          sed -i -E "s/(versionCode\s*=\s*)[0-9]+/\1$NEW_CODE/" composeApp/build.gradle.kts
          grep 'versionCode' composeApp/build.gradle.kts
          echo "new_code=$NEW_CODE" >> "$GITHUB_OUTPUT"

      - name: Write new versions into build files
        if: steps.semver.outputs.skipped != 'true'
        run: |
          NEW="${{ steps.semver.outputs.new_version }}"
          NEW_CODE="${{ steps.versioncode.outputs.new_code }}"
          
          echo "Updating versions to $NEW (code: $NEW_CODE)"
          
          # 1. Update Android & Desktop in build.gradle.kts
          # Update Android versionName (with 'v' prefix)
          sed -i -E "s/(versionName\s*=\s*)\"v?[^\"]+\"/\1\"v$NEW\"/" composeApp/build.gradle.kts
          # Update Desktop packageVersion (pure semver)
          sed -i -E "s/(packageVersion\s*=\s*)\"[^\"]+\"/\1\"$NEW\"/" composeApp/build.gradle.kts
          # Update Fat Jar archiveVersion
          sed -i -E "s/(archiveVersion\.set\()\"[^\"]+\"\)/\1\"$NEW\")/" composeApp/build.gradle.kts
          
          # 2. Update iOS in Config.xcconfig
          if [ -f "iosApp/Configuration/Config.xcconfig" ]; then
            sed -i -E "s/(MARKETING_VERSION\s*=\s*).*/\1$NEW/" iosApp/Configuration/Config.xcconfig
            sed -i -E "s/(CURRENT_PROJECT_VERSION\s*=\s*).*/\1$NEW_CODE/" iosApp/Configuration/Config.xcconfig
          fi

          echo "--- Updated composeApp/build.gradle.kts ---"
          grep -E "versionName|versionCode|packageVersion|archiveVersion" composeApp/build.gradle.kts
          
          if [ -f "iosApp/Configuration/Config.xcconfig" ]; then
            echo "--- Updated iosApp/Configuration/Config.xcconfig ---"
            cat iosApp/Configuration/Config.xcconfig
          fi

      - name: Validate all version fields
        if: steps.semver.outputs.skipped != 'true'
        run: |
           NEW="${{ steps.semver.outputs.new_version }}"
           NEW_CODE="${{ steps.versioncode.outputs.new_code }}"
           
           echo "Verifying all versions..."
           ERRORS=0
           
           # Android (2 fields)
           if ! grep -q "versionName.*"v$NEW"" composeApp/build.gradle.kts; then
             echo "❌ ERROR: Android versionName not updated to v$NEW"
             ERRORS=$((ERRORS + 1))
           fi
           if ! grep -q "versionCode.*$NEW_CODE" composeApp/build.gradle.kts; then
             echo "❌ ERROR: Android versionCode not updated to $NEW_CODE"
             ERRORS=$((ERRORS + 1))
           fi
           
           # Desktop (2 fields: packageVersion, archiveVersion)
           if ! grep -q "packageVersion.*"$NEW"" composeApp/build.gradle.kts; then
             echo "❌ ERROR: Desktop packageVersion not updated to $NEW"
             ERRORS=$((ERRORS + 1))
           fi
           if ! grep -Fq "archiveVersion.set(\"$NEW\")" composeApp/build.gradle.kts; then
             echo "❌ ERROR: Desktop archiveVersion not updated to $NEW"
             ERRORS=$((ERRORS + 1))
           fi
           
           # iOS (2 fields)
           if ! grep -q "MARKETING_VERSION.*$NEW" iosApp/Configuration/Config.xcconfig; then
             echo "❌ ERROR: iOS MARKETING_VERSION not updated to $NEW"
             ERRORS=$((ERRORS + 1))
           fi
           if ! grep -q "CURRENT_PROJECT_VERSION.*$NEW_CODE" iosApp/Configuration/Config.xcconfig; then
             echo "❌ ERROR: iOS CURRENT_PROJECT_VERSION not updated to $NEW_CODE"
             ERRORS=$((ERRORS + 1))
           fi
           
           if [ $ERRORS -gt 0 ]; then
             echo "❌ Version validation FAILED with $ERRORS errors"
             exit 1
           fi
           
           echo "✅ All 9 version fields verified successfully"

      - name: Commit & push version bump
        if: steps.semver.outputs.skipped != 'true'
        run: |
          NEW="${{ steps.semver.outputs.new_version }}"
          TARGET_BRANCH="${{ github.base_ref || github.ref_name }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add composeApp/build.gradle.kts iosApp/Configuration/Config.xcconfig
          if git diff --cached --quiet; then
            echo "Versions already up to date — nothing to commit."
          else
            git commit -m "chore: bump version to v$NEW"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: Write fastlane changelogs
        if: steps.semver.outputs.skipped != 'true' && github.event.inputs.changelog_en != ''
        run: |
           VERSION_CODE="${{ steps.versioncode.outputs.new_code }}"
           CHANGELOG_EN="${{ github.event.inputs.changelog_en }}"
           CHANGELOG_DE="${{ github.event.inputs.changelog_de }}"
           
           if [ -z "$CHANGELOG_EN" ]; then
             echo "Skipping changelog write: no changelog_en provided"
             exit 0
           fi
           
           EN_FILE="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
           mkdir -p "$(dirname "$EN_FILE")"
           printf '%s\n' "$CHANGELOG_EN" > "$EN_FILE"
           echo "✅ Created English changelog at $EN_FILE"
           
           if [ -n "$CHANGELOG_DE" ]; then
             DE_FILE="fastlane/metadata/android/de-DE/changelogs/$VERSION_CODE.txt"
             mkdir -p "$(dirname "$DE_FILE")"
             printf '%s\n' "$CHANGELOG_DE" > "$DE_FILE"
             echo "✅ Created German changelog at $DE_FILE"
           fi

      - name: Commit changelog files
        if: steps.semver.outputs.skipped != 'true' && github.event.inputs.changelog_en != ''
        run: |
           VERSION_CODE="${{ steps.versioncode.outputs.new_code }}"
           
           git config user.name  "github-actions[bot]"
           git config user.email "github-actions[bot]@users.noreply.github.com"
           
           git add "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt" || true
           git add "fastlane/metadata/android/de-DE/changelogs/$VERSION_CODE.txt" || true
           
           if git diff --cached --quiet; then
             echo "No changelog changes to commit"
           else
             git commit -m "chore: add multilingual release notes for v${{ steps.semver.outputs.new_version }}"
             git push origin "HEAD:${{ github.base_ref || github.ref_name }}"
           fi

      - name: Create GitHub Release with notes
        if: steps.semver.outputs.skipped != 'true' && github.event.inputs.changelog_en != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
           VERSION="${{ steps.semver.outputs.new_version }}"
           CHANGELOG_EN="${{ github.event.inputs.changelog_en }}"
           CHANGELOG_DE="${{ github.event.inputs.changelog_de }}"
           
           if [ -z "$CHANGELOG_EN" ]; then
             echo "Skipping GitHub Release creation: no changelog_en provided"
             exit 0
           fi
           
           NOTES="## English\n$CHANGELOG_EN\n\n## Deutsch\n$CHANGELOG_DE"
           
           gh release create "v$VERSION" \
             --title "v$VERSION" \
             --notes "$(printf "$NOTES")" \
             --target main || true
           
           echo "✅ GitHub Release v$VERSION created with multilingual notes"

  create-release:
    runs-on: ubuntu-latest
    environment: production
    needs: [ bump-version ]
    if: always() && !failure() && !cancelled()
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      skipped: ${{ steps.check-tag.outputs.skipped }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Read composeApp version
        id: version
        run: |
          VERSION_NAME="${{ needs.bump-version.outputs.new_version }}"
          if [ -z "$VERSION_NAME" ]; then
            # Fallback: read from file (should not normally be needed)
            VERSION_NAME=$(grep -m1 'versionName' composeApp/build.gradle.kts | sed -E 's/.*"v?([^"]+)".*/\1/')
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME"    >> "$GITHUB_OUTPUT"

      - name: Check release and git tag state
        id: check-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          RELEASE_EXISTS="false"
          TAG_EXISTS="false"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            RELEASE_EXISTS="true"
            echo "Release $TAG already exists."
          else
            echo "Release $TAG does not exist yet."
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            TAG_EXISTS="true"
            echo "Git tag $TAG already exists in origin."
          else
            echo "Git tag $TAG is missing in origin."
          fi

          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"

          if [ "$RELEASE_EXISTS" = "true" ] && [ "$TAG_EXISTS" = "true" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Git tag exists in remote
        if: steps.check-tag.outputs.tag_exists != 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists in origin."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Wait until tag is visible
        if: steps.check-tag.outputs.tag_exists != 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          for i in {1..10}; do
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
              echo "Tag $TAG is visible in origin."
              exit 0
            fi
            echo "Tag $TAG not visible yet (attempt $i/10), waiting..."
            sleep 3
          done
          echo "Tag $TAG was not visible in origin in time."
          exit 1

      - name: Create Release
        if: steps.check-tag.outputs.release_exists != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-deb-amd64:
    needs: create-release
    if: needs.create-release.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.create-release.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build DEB package
        run: ./gradlew :composeApp:packageDeb

      - name: Find DEB file
        id: find-deb
        run: |
          DEB_FILE=$(find composeApp/build/compose/binaries/main/deb -name "*.deb" -type f)
          echo "deb_file=$DEB_FILE" >> $GITHUB_OUTPUT
          echo "deb_name=$(basename $DEB_FILE)" >> $GITHUB_OUTPUT

      - name: Rename DEB package
        if: success()
        run: |
          DEB_FILE=$(find composeApp/build/compose/binaries/main/deb -name "dhbw-*.deb" -type f)
          if [ -z "$DEB_FILE" ]; then
            echo "Skipping DEB rename: file not found"
            exit 0
          fi
          VERSION="${{ needs.create-release.outputs.version }}"
          DEB_DIR=$(dirname "$DEB_FILE")
          NEW_NAME="$DEB_DIR/dhbw-student-app-v$VERSION.deb"
          mv "$DEB_FILE" "$NEW_NAME"
          echo "✅ Renamed DEB to $(basename $NEW_NAME)"

      - name: Verify DEB metadata
        if: success()
        run: |
          DEB_FILE=$(find composeApp/build/compose/binaries/main/deb -name "dhbw-student-app-v*.deb" -type f | head -n 1)
          if [ -f "$DEB_FILE" ]; then
            echo "DEB Control Info:"
            dpkg-deb -I "$DEB_FILE" | grep -E "Package:|Version:|Architecture:"
            echo "✅ DEB metadata verified"
          fi


      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: ${{ steps.find-deb.outputs.deb_file }}
          retention-days: 1


  build-dmg-macos:
    needs: create-release
    if: needs.create-release.outputs.skipped != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.create-release.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Build DMG package
        run: ./gradlew :composeApp:packageDmg

      - name: Find DMG file
        id: find-dmg
        run: |
          DMG_FILE=$(find composeApp/build/compose/binaries/main/dmg -name "*.dmg" -type f | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            echo "Error: No DMG file found"
            exit 1
          fi
          echo "dmg_file=$DMG_FILE" >> $GITHUB_OUTPUT
          echo "dmg_name=$(basename $DMG_FILE)" >> $GITHUB_OUTPUT

      - name: Rename DMG package
        if: success()
        run: |
          DMG_FILE=$(find composeApp/build/compose/binaries/main/dmg -name "*.dmg" -type f | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            echo "Skipping DMG rename: file not found"
            exit 0
          fi
          VERSION="${{ needs.create-release.outputs.version }}"
          DMG_DIR=$(dirname "$DMG_FILE")
          NEW_NAME="$DMG_DIR/dhbw-student-app-v$VERSION.dmg"
          mv "$DMG_FILE" "$NEW_NAME"
          echo "dmg_renamed=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "✅ Renamed DMG to $(basename $NEW_NAME)"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-macos
          path: ${{ steps.find-dmg.outputs.dmg_file }}
          retention-days: 1

  build-android-apk:
    needs: create-release
    if: needs.create-release.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.create-release.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Build Signed APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease

      - name: Find APK file
        id: find-apk
        run: |
          APK_FILE=$(find composeApp/build/outputs/apk/release -name "*.apk" -type f ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No signed APK file found"
            exit 1
          fi
          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_FILE)" >> $GITHUB_OUTPUT

      - name: Rename APK
        id: rename-apk
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          ORIGINAL_APK="${{ steps.find-apk.outputs.apk_file }}"
          APK_DIR=$(dirname "$ORIGINAL_APK")
          RENAMED_APK="$APK_DIR/dhbw-student-app-release-v$VERSION.apk"
          cp "$ORIGINAL_APK" "$RENAMED_APK"
          echo "renamed_apk=$RENAMED_APK" >> $GITHUB_OUTPUT
          echo "renamed_apk_name=dhbw-student-app-release-v$VERSION.apk" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-android
          path: ${{ steps.rename-apk.outputs.renamed_apk }}
          retention-days: 1

      - name: Cleanup Keystore
        if: always()
        run: rm -f keystore.jks

  # ---------------------------------------------------------------------------
  # Build signed AAB — Google Play Store upload
  # Uses the Play Store upload key (UPLOAD_*) which is separate from the APK
  # signing key (SIGNING_*).  Google re-signs the AAB with the app signing key
  # after it passes review, so only the upload key is needed here.
  # ---------------------------------------------------------------------------
  build-android-aab:
    name: Build Android AAB (Play Store)
    needs: create-release
    if: needs.create-release.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.create-release.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Build signed AAB
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :composeApp:bundleRelease

      - name: Find AAB file
        id: find-aab
        run: |
          AAB_FILE=$(find composeApp/build/outputs/bundle/release -name "*.aab" -type f | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "Error: No AAB file found"
            exit 1
          fi
          echo "aab_file=$AAB_FILE" >> $GITHUB_OUTPUT

      - name: Rename AAB
        id: rename-aab
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          ORIGINAL_AAB="${{ steps.find-aab.outputs.aab_file }}"
          AAB_DIR=$(dirname "$ORIGINAL_AAB")
          RENAMED_AAB="$AAB_DIR/dhbw-student-app-release-v$VERSION.aab"
          cp "$ORIGINAL_AAB" "$RENAMED_AAB"
          echo "renamed_aab=$RENAMED_AAB" >> $GITHUB_OUTPUT

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-android
          path: ${{ steps.rename-aab.outputs.renamed_aab }}
          retention-days: 1

      - name: Cleanup upload keystore
        if: always()
        run: rm -f upload-keystore.jks

  build-msi-app:
    needs:
      - create-release
    if: needs.create-release.outputs.skipped != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.create-release.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          sparse-checkout: |
            /*
            !/.planning/
          sparse-checkout-cone-mode: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Build MSI package
        run: ./gradlew.bat :composeApp:packageMsi

      - name: Find and rename MSI
        id: find-downloaded-msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'composeApp/build/compose/binaries/main/msi') -Filter '*.msi' -Recurse -File | Select-Object -First 1
          if (-not $msi) {
            throw 'No MSI artifact found'
          }
          $version = "${{ needs.create-release.outputs.version }}"
          $dir = $msi.Directory.FullName
          $renamed = Join-Path $dir "dhbw-student-app-release-v$version.msi"
          Copy-Item -Path $msi.FullName -Destination $renamed -Force
          "msi_path=$renamed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "MSI ready at: $renamed"

      - name: Rename MSI package
        if: success()
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'composeApp/build/compose/binaries/main/msi') -Filter 'dhbw-*.msi' -Recurse -File | Select-Object -First 1
          if (-not $msi) {
            Write-Host "Skipping MSI rename: file not found"
            exit 0
          }
          $version = "${{ needs.create-release.outputs.version }}"
          $dir = $msi.Directory.FullName
          $newName = Join-Path $dir "dhbw-student-app-v$version.msi"
          Move-Item -Path $msi.FullName -Destination $newName -Force
          Write-Host "✅ Renamed MSI to $(Split-Path -Leaf $newName)"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-package
          path: ${{ steps.find-downloaded-msi.outputs.msi_path }}
          retention-days: 1

  clean-release:
    name: Publish Release
    needs:
      - create-release
      - build-android-apk
      - build-android-aab
      - build-deb-amd64
      - build-dmg-macos
      - build-msi-app
    if: always() && needs.create-release.outputs.skipped != 'true' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Upload all assets to draft release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release (remove draft)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag     = '${{ needs.create-release.outputs.tag }}';
            const version = '${{ needs.create-release.outputs.version }}';

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              tag,
            });

            await github.rest.repos.updateRelease({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              release_id: release.id,
              draft:      false,
              name:       `v${version}`,
            });

            console.log(`✓ Published release v${version} (${tag})`);
