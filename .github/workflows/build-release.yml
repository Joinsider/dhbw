name: Build and Release Multi-Platform Packages

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  # -- Manual trigger -----------------------------------------------------------
  # Choose how the version should be incremented before building.
  # On a PR merge the default (patch) is used automatically.
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor

jobs:
  # -----------------------------------------------------------------------------
  # Version-bump job — runs when a PR is merged into main, or manually.
  # On PR merge the bump type defaults to "patch".
  # On workflow_dispatch the selected bump type is used.
  # Reads the current versionName from composeApp/build.gradle.kts, computes
  # the next semver in pure bash, writes it back, and commits it to the branch.
  # -----------------------------------------------------------------------------
  bump-version:
    name: Bump version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.semver.outputs.new_version }}
      new_tag: ${{ steps.semver.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Compute next semver
        id: semver
        run: |
          # ── Read current version (strip leading "v" if present) ──────────────
          CURRENT=$(grep -m1 'versionName' composeApp/build.gradle.kts \
            | sed -E 's/.*"v?([^"]+)".*/\1/')
          echo "Current version: $CURRENT"

          # ── Determine bump type ───────────────────────────────────────────────
          BUMP="${{ github.event.inputs.bump }}"
          if [ -z "$BUMP" ]; then
            BUMP="patch"   # default for push / merge triggers
          fi
          echo "Bump type: $BUMP"

          # ── Pure-bash semver arithmetic ───────────────────────────────────────
          # Strip any pre-release suffix (e.g. "1.2.3-alpha.0" → "1.2.3")
          BASE=$(echo "$CURRENT" | sed -E 's/-[^+]+//')
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)

          case "$BUMP" in
            major)
              NEW="$((MAJOR + 1)).0.0" ;;
            minor)
              NEW="${MAJOR}.$((MINOR + 1)).0" ;;
            patch)
              NEW="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            premajor)
              NEW="$((MAJOR + 1)).0.0-alpha.0" ;;
            preminor)
              NEW="${MAJOR}.$((MINOR + 1)).0-alpha.0" ;;
            prepatch)
              NEW="${MAJOR}.${MINOR}.$((PATCH + 1))-alpha.0" ;;
            *)
              echo "Unknown bump type '$BUMP', falling back to patch"
              NEW="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "New version: $NEW"
          echo "new_version=$NEW"  >> "$GITHUB_OUTPUT"
          echo "new_tag=v$NEW"     >> "$GITHUB_OUTPUT"

      - name: Write new versionName into build.gradle.kts
        run: |
          NEW="${{ steps.semver.outputs.new_version }}"
          sed -i -E "s/(versionName\s*=\s*)\"v?[^\"]+\"/\1\"v$NEW\"/" composeApp/build.gradle.kts
          grep 'versionName' composeApp/build.gradle.kts

      - name: Bump Android versionCode
        id: versioncode
        run: |
          # Read the current integer versionCode
          CURRENT_CODE=$(grep -m1 'versionCode' composeApp/build.gradle.kts \
            | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/')
          NEW_CODE=$((CURRENT_CODE + 1))
          echo "versionCode: $CURRENT_CODE → $NEW_CODE"
          sed -i -E "s/(versionCode\s*=\s*)[0-9]+/\1$NEW_CODE/" composeApp/build.gradle.kts
          grep 'versionCode' composeApp/build.gradle.kts
          echo "new_code=$NEW_CODE" >> "$GITHUB_OUTPUT"

      - name: Commit & push version bump
        run: |
          NEW="${{ steps.semver.outputs.new_version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add composeApp/build.gradle.kts
          if git diff --cached --quiet; then
            echo "versionName already at v$NEW — nothing to commit."
          else
            git commit -m "chore: bump version to v$NEW"
            git push origin HEAD:${{ github.ref_name }}
          fi

  create-release:
    runs-on: ubuntu-latest
    environment: production
    needs: [ bump-version ]
    if: always() && !failure() && !cancelled()
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read composeApp version
        id: version
        run: |
          VERSION_NAME="${{ needs.bump-version.outputs.new_version }}"
          if [ -z "$VERSION_NAME" ]; then
            # Fallback: read from file (should not normally be needed)
            VERSION_NAME=$(grep -m1 'versionName' composeApp/build.gradle.kts | sed -E 's/.*"v?([^"]+)".*/\1/')
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME"    >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-deb-amd64:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build DEB package
        run: ./gradlew :composeApp:packageDeb

      - name: Find DEB file
        id: find-deb
        run: |
          DEB_FILE=$(find composeApp/build/compose/binaries/main/deb -name "*.deb" -type f)
          echo "deb_file=$DEB_FILE" >> $GITHUB_OUTPUT
          echo "deb_name=$(basename $DEB_FILE)" >> $GITHUB_OUTPUT

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: ${{ steps.find-deb.outputs.deb_file }}
          retention-days: 1


  build-dmg-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Build DMG package
        run: ./gradlew :composeApp:packageDmg

      - name: Find DMG file
        id: find-dmg
        run: |
          DMG_FILE=$(find composeApp/build/compose/binaries/main/dmg -name "*.dmg" -type f | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            echo "Error: No DMG file found"
            exit 1
          fi
          echo "dmg_file=$DMG_FILE" >> $GITHUB_OUTPUT
          echo "dmg_name=$(basename $DMG_FILE)" >> $GITHUB_OUTPUT

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-macos
          path: ${{ steps.find-dmg.outputs.dmg_file }}
          retention-days: 1

  build-android-apk:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Build Signed APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease

      - name: Find APK file
        id: find-apk
        run: |
          APK_FILE=$(find composeApp/build/outputs/apk/release -name "*.apk" -type f ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No signed APK file found"
            exit 1
          fi
          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_FILE)" >> $GITHUB_OUTPUT

      - name: Rename APK
        id: rename-apk
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          ORIGINAL_APK="${{ steps.find-apk.outputs.apk_file }}"
          APK_DIR=$(dirname "$ORIGINAL_APK")
          RENAMED_APK="$APK_DIR/dhbw-student-app-release-v$VERSION.apk"
          cp "$ORIGINAL_APK" "$RENAMED_APK"
          echo "renamed_apk=$RENAMED_APK" >> $GITHUB_OUTPUT
          echo "renamed_apk_name=dhbw-student-app-release-v$VERSION.apk" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-android
          path: ${{ steps.rename-apk.outputs.renamed_apk }}
          retention-days: 1

      - name: Cleanup Keystore
        if: always()
        run: rm -f keystore.jks

  # ---------------------------------------------------------------------------
  # Build signed AAB — Google Play Store upload
  # Uses the Play Store upload key (UPLOAD_*) which is separate from the APK
  # signing key (SIGNING_*).  Google re-signs the AAB with the app signing key
  # after it passes review, so only the upload key is needed here.
  # ---------------------------------------------------------------------------
  build-android-aab:
    name: Build Android AAB (Play Store)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Build signed AAB
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/upload-keystore.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.UPLOAD_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :composeApp:bundleRelease

      - name: Find AAB file
        id: find-aab
        run: |
          AAB_FILE=$(find composeApp/build/outputs/bundle/release -name "*.aab" -type f | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "Error: No AAB file found"
            exit 1
          fi
          echo "aab_file=$AAB_FILE" >> $GITHUB_OUTPUT

      - name: Rename AAB
        id: rename-aab
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          ORIGINAL_AAB="${{ steps.find-aab.outputs.aab_file }}"
          AAB_DIR=$(dirname "$ORIGINAL_AAB")
          RENAMED_AAB="$AAB_DIR/dhbw-student-app-release-v$VERSION.aab"
          cp "$ORIGINAL_AAB" "$RENAMED_AAB"
          echo "renamed_aab=$RENAMED_AAB" >> $GITHUB_OUTPUT

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-android
          path: ${{ steps.rename-aab.outputs.renamed_aab }}
          retention-days: 1

      - name: Cleanup upload keystore
        if: always()
        run: rm -f upload-keystore.jks

  build-msix-app:
    needs:
      - create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Build MSI package
        run: ./gradlew.bat :composeApp:packageMsi

      - name: Find and rename MSI
        id: find-downloaded-msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'composeApp/build/compose/binaries/main/msi') -Filter '*.msi' -Recurse -File | Select-Object -First 1
          if (-not $msi) {
            throw 'No MSI artifact found'
          }
          $version = "${{ needs.create-release.outputs.version }}"
          $dir = $msi.Directory.FullName
          $renamed = Join-Path $dir "dhbw-student-app-release-v$version.msi"
          Copy-Item -Path $msi.FullName -Destination $renamed -Force
          "msi_path=$renamed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "MSI ready at: $renamed"

      - name: Find Windows SDK tools
        id: find-sdk
        shell: pwsh
        run: |
          # Find the latest SDK version
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\bin"
          $latestSdk = Get-ChildItem -Path $sdkPath -Directory | 
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | 
            Sort-Object Name -Descending | 
            Select-Object -First 1
          
          if (-not $latestSdk) {
            throw "Windows SDK not found"
          }
          
          $makeAppxPath = Join-Path $latestSdk.FullName "x64\makeappx.exe"
          $signToolPath = Join-Path $latestSdk.FullName "x64\signtool.exe"
          
          if (-not (Test-Path $makeAppxPath)) {
            throw "MakeAppx.exe not found at $makeAppxPath"
          }
          if (-not (Test-Path $signToolPath)) {
            throw "SignTool.exe not found at $signToolPath"
          }
          
          "makeappx_path=$makeAppxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "signtool_path=$signToolPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Found SDK tools in $($latestSdk.Name)"

      - name: Extract MSI contents
        shell: pwsh
        run: |
          $msiPath = "${{ steps.find-downloaded-msi.outputs.msi_path }}"
          $extractDir = Join-Path $PWD "msix-package"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          Write-Host "Extracting MSI from $msiPath to $extractDir"
          $process = Start-Process msiexec.exe -ArgumentList "/a `"$msiPath`" /qn TARGETDIR=`"$extractDir`"" -Wait -PassThru -NoNewWindow

          if ($process.ExitCode -ne 0) {
            throw "MSI extraction failed with exit code $($process.ExitCode)"
          }

          # List extracted structure for debugging
          Write-Host "`nExtracted MSI structure:"
          Get-ChildItem -Path $extractDir -Recurse -File | Select-Object -First 20 | ForEach-Object { Write-Host "  $($_.FullName.Replace($extractDir, ''))" }

      - name: Prepare MSIX package structure
        shell: pwsh
        run: |
          $packageDir = "msix-package-final"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$packageDir\Assets" | Out-Null

          # Find where the executable actually is in the extracted MSI (dynamic — works for any app name)
          $exeFile = Get-ChildItem -Path "msix-package" -Filter "*.exe" -Recurse -File |
            Where-Object { $_.Name -notmatch '^(msiexec|wscript|cscript|regsvr32)' } |
            Select-Object -First 1

          if (-not $exeFile) {
            Write-Host "ERROR: No .exe found in extracted MSI!"
            throw "No executable found in MSI extraction"
          }

          $exeName = $exeFile.Name
          $appFolderName = [System.IO.Path]::GetFileNameWithoutExtension($exeName)
          Write-Host "Found executable: $exeName  →  VFS folder: $appFolderName"

          New-Item -ItemType Directory -Force -Path "$packageDir\VFS\ProgramFilesX64\$appFolderName" | Out-Null

          # Copy all files from the executable's directory to the VFS structure
          $exeDir = $exeFile.Directory
          Write-Host "Copying files from $($exeDir.FullName) to VFS\ProgramFilesX64\$appFolderName"
          Copy-Item -Path "$($exeDir.FullName)\*" -Destination "$packageDir\VFS\ProgramFilesX64\$appFolderName" -Recurse -Force

          # Verify the executable is in the correct location
          $targetExe = "$packageDir\VFS\ProgramFilesX64\$appFolderName\$exeName"
          if (-not (Test-Path $targetExe)) {
            throw "Failed to copy $exeName to $targetExe"
          }
          Write-Host "Verified executable at: $targetExe"

          # Copy AppxManifest.xml from repository
          $manifestSource = "packaging\windows\AppxManifest.xml"
          if (-not (Test-Path $manifestSource)) {
            throw "AppxManifest.xml not found at $manifestSource"
          }
          Copy-Item -Path $manifestSource -Destination "$packageDir\AppxManifest.xml" -Force

          Write-Host "Package structure prepared successfully"


      - name: Generate MSIX assets from icon
        shell: pwsh
        run: |
          # Check if icon.ico exists in packaging folder
          $iconSource = "packaging\windows\Assets\icon.ico"
          if (-not (Test-Path $iconSource)) {
            Write-Host "Warning: icon.ico not found at $iconSource"
          
            # Try to find icons in extracted MSI content as fallback
            $extractedIcons = Get-ChildItem -Path "msix-package-final" -Filter "*.ico" -Recurse -File
            if ($extractedIcons.Count -gt 0) {
              $iconSource = $extractedIcons[0].FullName
              Write-Host "Found icon in MSI: $iconSource"
            } else {
              throw "No icon.ico found in packaging/windows/Assets/ or extracted MSI content"
            }
          } else {
            Write-Host "Using icon from: $iconSource"
          }

          # Use .NET to extract images from ICO and resize
          Add-Type -AssemblyName System.Drawing
          
          $ico = [System.Drawing.Icon]::new($iconSource)
          
          # Function to save icon as PNG at specific size
          function Save-IconAsPng {
            param($icon, $size, $outputPath)
          
            $bitmap = [System.Drawing.Bitmap]::new($size, $size)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $graphics.DrawImage($icon.ToBitmap(), 0, 0, $size, $size)
            $bitmap.Save($outputPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          
          # Generate required asset sizes
          $assetsDir = "msix-package-final\Assets"
          
          Save-IconAsPng -icon $ico -size 44 -outputPath "$assetsDir\DHBWNEXT-Square44x44Logo.png"
          Save-IconAsPng -icon $ico -size 71 -outputPath "$assetsDir\DHBWNEXT-Square71x71Logo.png"
          Save-IconAsPng -icon $ico -size 150 -outputPath "$assetsDir\DHBWNEXT-Square150x150Logo.png"
          Save-IconAsPng -icon $ico -size 310 -outputPath "$assetsDir\DHBWNEXT-Square310x310Logo.png"
          
          # Wide logo (310x150)
          $wideBitmap = [System.Drawing.Bitmap]::new(310, 150)
          $graphics = [System.Drawing.Graphics]::FromImage($wideBitmap)
          $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $graphics.DrawImage($ico.ToBitmap(), 80, 0, 150, 150)
          $wideBitmap.Save("$assetsDir\DHBWNEXT-Wide310x150Logo.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $wideBitmap.Dispose()
          
          # StoreLogo (50x50)
          Save-IconAsPng -icon $ico -size 50 -outputPath "$assetsDir\StoreLogo.png"
          
          $ico.Dispose()
          
          Write-Host "Generated all required MSIX assets from icon.ico"

      - name: Update manifest version
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $manifestPath = "msix-package-final\AppxManifest.xml"

          # Ensure version format is x.x.x.0
          $versionParts = $version.Split('.')
          while ($versionParts.Count -lt 4) {
            $versionParts += "0"
          }
          $msixVersion = $versionParts[0..3] -join '.'

          # Update version in manifest
          $manifest = [xml](Get-Content $manifestPath)
          $manifest.Package.Identity.Version = $msixVersion
          $manifest.Save($manifestPath)
          
          Write-Host "Updated manifest version to $msixVersion"

      - name: Create MSIX package
        shell: pwsh
        run: |
          $makeAppx = "${{ steps.find-sdk.outputs.makeappx_path }}"
          $packageDir = "msix-package-final"
          $version = "${{ needs.create-release.outputs.version }}"
          $outputMsix = "dhbw-student-app-release-v$version.msix"

          Write-Host "Creating MSIX package: $outputMsix"
          & $makeAppx pack /d $packageDir /p $outputMsix /v
          
          if ($LASTEXITCODE -ne 0) {
            throw "MakeAppx failed with exit code $LASTEXITCODE"
          }
          
          Write-Host "Successfully created $outputMsix"
          
      - name: Skip self-signing for Store submission
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $msixFile = "dhbw-student-app-release-v$version.msix"
          
          Write-Host "================================================"
          Write-Host "Skipping self-signing for Microsoft Store submission"
          Write-Host "================================================"
          Write-Host ""
          Write-Host "The Microsoft Store will automatically sign this package with a trusted certificate."
          Write-Host "This unsigned MSIX is valid for Store submission but cannot be installed locally."
          Write-Host ""
          
          # Verify the MSIX package structure is valid (correct syntax)
          $makeAppx = "${{ steps.find-sdk.outputs.makeappx_path }}"
          Write-Host "Verifying package structure..."
          
          # Unpack to verify, then repack (this validates the package)
          $testDir = "msix-verify-test"
          & $makeAppx unpack /p $msixFile /d $testDir /nv
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✓ Package structure is valid"
            Remove-Item -Path $testDir -Recurse -Force
          } else {
            throw "MSIX package structure validation failed"
          }
          
          # Show package info
          Write-Host ""
          Write-Host "Package details:"
          $fileInfo = Get-Item $msixFile
          Write-Host "  File: $($fileInfo.Name)"
          Write-Host "  Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
          Write-Host "  Created: $($fileInfo.CreationTime)"
          Write-Host ""
          Write-Host "✓ Package is ready for Microsoft Store submission"      

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-package
          path: ${{ steps.find-downloaded-msi.outputs.msi_path }}
          retention-days: 1

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-windows
          path: dhbw-student-app-release-v${{ needs.create-release.outputs.version }}.msix
          retention-days: 1

  clean-release:
    name: Publish Release
    needs:
      - create-release
      - build-android-apk
      - build-android-aab
      - build-deb-amd64
      - build-dmg-macos
      - build-msix-app
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Upload all assets to draft release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release (remove draft)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag     = '${{ needs.create-release.outputs.tag }}';
            const version = '${{ needs.create-release.outputs.version }}';

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              tag,
            });

            await github.rest.repos.updateRelease({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              release_id: release.id,
              draft:      false,
              name:       `v${version}`,
            });

            console.log(`✓ Published release v${version} (${tag})`);


