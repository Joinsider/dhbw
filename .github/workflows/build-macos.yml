name: Build macOS App

# Native macOS app (SwiftUI, iosApp/) as a Developer ID signed, notarized DMG — the asset for
# GitHub Releases and Homebrew. The release workflow calls this with the release tag; started by
# hand it builds the selected branch and keeps the DMG as a run artifact, without a release.
#
# Two jobs on two runners, so the signing key never shares a machine with the build:
#
#   build  Archives the app with CODE_SIGNING_ALLOWED=NO. This is where Gradle runs, and with it
#          every Kotlin and Android plugin and dependency. It has no secrets.
#   sign   A fresh runner in the `release-signing` environment. It runs only Apple's tools and the
#          scripts in packaging/macos/: signs the app (sign-app.sh), notarizes it, builds the DMG.
#          The private key is imported as non-extractable, so a step that misbehaves could still
#          sign with it during the run but could not take it along.
#
# Signing is manual on purpose. Automatic signing would need an Apple Development certificate on
# the runner, and with an API key Xcode creates a fresh one on every run, which runs into the
# certificate limit. A Developer ID profile is required either way: the app's
# keychain-access-groups entitlement is restricted on macOS, and without an embedded profile the
# system refuses to launch the app.
#
# Secrets (environment secrets of `release-signing`; the release workflow passes them with
# `secrets: inherit`, and the environment's own secrets win over repository secrets of the same name):
#   MACOS_DEVID_P12_BASE64        Developer ID Application certificate + private key, base64 .p12
#   MACOS_DEVID_P12_PASSWORD      password of that .p12
#   MACOS_DEVID_PROFILE_BASE64    Developer ID provisioning profile for de.fampopprol.dhbw, base64
#   ASC_KEY_P8_BASE64             App Store Connect API key (AuthKey_*.p8), base64 — notarization
#   ASC_KEY_ID                    key ID of that API key
#   ASC_ISSUER_ID                 issuer ID of the App Store Connect team
# The keychain password is generated per run and never stored.
#
# How to create each of them: documentation/macOS/README.md.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build (the release tag)'
        required: true
        type: string
      version:
        description: 'Release version without the leading v; must match Config.xcconfig'
        required: true
        type: string
      retention-days:
        description: 'How long the DMG artifact is kept'
        required: false
        default: 1
        type: number
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # No secrets in this job: it runs the whole Gradle build and everything that comes with it.
  build:
    name: Build macOS app (unsigned archive)
    runs-on: macos-latest
    outputs:
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      dmg_name: ${{ steps.version.outputs.dmg_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      # Kotlin/Native's toolchain and dependencies, about 1 GB that would otherwise be downloaded
      # by the Xcode build phase on every run.
      - name: Cache Kotlin/Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # The Xcode build phase runs Gradle, and every Gradle invocation configures :composeApp,
      # which carries the Android plugin — so even this build needs an SDK. Same step as ci.yml.
      - name: Set up Android SDK
        run: |
          sdk="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "::error::No Android cmdline-tools found at $sdk"
            exit 1
          fi

          compile_sdk=$(sed -n 's/^android-compileSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          build_tools=$(sed -n 's/.*buildToolsVersion = "\(.*\)"/\1/p' androidApp/build.gradle.kts)
          echo "compileSdk: $compile_sdk, build tools: $build_tools"
          test -n "$compile_sdk" && test -n "$build_tools"
          # From API 37 the SDK platform package carries a minor version (`platforms;android-37.0`);
          # there is no `platforms;android-37`, and AGP resolves compileSdk 37 to android-37.0.
          case "$compile_sdk" in
            *.*) platform="$compile_sdk" ;;
            *) if [ "$compile_sdk" -ge 37 ]; then platform="$compile_sdk.0"; else platform="$compile_sdk"; fi ;;
          esac

          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

          # `yes` dies of SIGPIPE once sdkmanager stops reading, which pipefail would report.
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install \
            "platform-tools" \
            "platforms;android-$platform" \
            "build-tools;$build_tools"

      # Xcode 26 is needed for the macOS 26 SDK. The macos-latest image does not guarantee which
      # Xcode is the default, so it is selected explicitly and the job fails if there is none.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner image; the macOS 26 SDK is required."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          sdk_major=$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)
          if [ "$sdk_major" -lt 26 ]; then
            echo "::error::macOS SDK $sdk_major is older than 26."
            exit 1
          fi

      # Config.xcconfig is what the release workflow's version bump writes. A release build must
      # match its tag; a manual build takes the version from the file and marks the DMG with the
      # commit, so it cannot be mistaken for the released one.
      # Inputs and the outputs derived from them reach shell code through env, never through ${{ }}
      # inside a run block, where they would be pasted into the script unquoted.
      - name: Read version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          XC_VERSION=$(sed -n 's/^MARKETING_VERSION *= *//p' iosApp/Configuration/Config.xcconfig | tr -d ' \r')
          XC_BUILD=$(sed -n 's/^CURRENT_PROJECT_VERSION *= *//p' iosApp/Configuration/Config.xcconfig | tr -d ' \r')

          if [ -n "$RELEASE_VERSION" ]; then
            if [ "$XC_VERSION" != "$RELEASE_VERSION" ]; then
              echo "::error::Config.xcconfig MARKETING_VERSION ($XC_VERSION) does not match the release ($RELEASE_VERSION)."
              exit 1
            fi
            DMG_NAME="dhbw-student-app-v$RELEASE_VERSION.dmg"
          else
            DMG_NAME="dhbw-student-app-v$XC_VERSION-$(git rev-parse --short HEAD).dmg"
          fi

          echo "Version $XC_VERSION ($XC_BUILD) -> $DMG_NAME"
          echo "marketing_version=$XC_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$XC_BUILD"        >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME"            >> "$GITHUB_OUTPUT"

      # ARCHS=arm64 because the Kotlin framework is built for macosArm64 only; the Xcode build
      # phase runs :shared:embedAndSignAppleFrameworkForXcode for that slice. Nothing is signed
      # here — the "Embed Shared.framework (macOS)" phase skips codesign when signing is off, and
      # sign-app.sh signs the framework and the app in the next job.
      - name: Archive macOS app (unsigned)
        env:
          APP_VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

          app=$(find "$RUNNER_TEMP/app.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d | head -n 1)
          if [ -z "$app" ]; then
            echo "::error::The archive contains no .app bundle."
            exit 1
          fi
          # ditto keeps the framework's internal symlinks, which upload-artifact would not.
          mkdir -p "$RUNNER_TEMP/unsigned"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/unsigned/app.zip"
          echo "Archived $(basename "$app")"

      # Not a release asset: the release workflow downloads only the artifacts it names.
      - name: Upload unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-unsigned-app
          path: ${{ runner.temp }}/unsigned/app.zip
          retention-days: 1
          if-no-files-found: error

  # A fresh runner that never ran Gradle. Only Apple's tools and packaging/macos/ run while the key
  # is on it. The environment limits which branches and tags may use the signing secrets.
  sign:
    name: Sign, notarize and package (Developer ID DMG)
    needs: build
    runs-on: macos-latest
    environment: release-signing
    env:
      APPLE_TEAM_ID: 56T6W6Z755
      BUNDLE_ID: de.fampopprol.dhbw
      DMG_VOLUME: Horb-Studenten-App
    steps:
      # Fails first and names every missing secret, instead of failing later inside `security import`.
      - name: Check signing secrets
        env:
          MACOS_DEVID_P12_BASE64: ${{ secrets.MACOS_DEVID_P12_BASE64 }}
          MACOS_DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
          MACOS_DEVID_PROFILE_BASE64: ${{ secrets.MACOS_DEVID_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          missing=0
          for name in MACOS_DEVID_P12_BASE64 MACOS_DEVID_P12_PASSWORD MACOS_DEVID_PROFILE_BASE64 \
                      ASC_KEY_P8_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (see documentation/macOS/README.md)."
              missing=1
            fi
          done
          exit "$missing"

      # Only for packaging/macos/ and the entitlements file; nothing from the checkout is built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # Xcode 26 is needed for the macOS 26 SDK. The macos-latest image does not guarantee which
      # Xcode is the default, so it is selected explicitly and the job fails if there is none.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner image; the macOS 26 SDK is required."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          sdk_major=$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)
          if [ "$sdk_major" -lt 26 ]; then
            echo "::error::macOS SDK $sdk_major is older than 26."
            exit 1
          fi

      - name: Download unsigned app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-unsigned-app
          path: ${{ runner.temp }}/unsigned

      - name: Unpack unsigned app
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          ditto -x -k "$RUNNER_TEMP/unsigned/app.zip" "$RUNNER_TEMP/app"
          app=$(find "$RUNNER_TEMP/app" -maxdepth 1 -name '*.app' -type d | head -n 1)
          test -n "$app"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Create keychain and import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVID_P12_BASE64 }}
          P12_PASSPHRASE: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_SECRET="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_SECRET"

          security create-keychain -p "$KEYCHAIN_SECRET" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_SECRET" "$KEYCHAIN"
          # Keep the default keychains searchable alongside the temporary one.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Apple's Developer ID G2 intermediate, so codesign can build the chain on a fresh runner.
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" -T /usr/bin/codesign

          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          # -x: the private key cannot be exported from the keychain again. Steps after this one can
          # sign with it while the run lasts, but nothing can copy it off the runner.
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$P12_PASSPHRASE" -x \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          # Lets codesign use the key without a UI prompt on the headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_SECRET" "$KEYCHAIN" > /dev/null

          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity in the imported certificate."
            exit 1
          fi
          if ! grep -q "($APPLE_TEAM_ID)" <<< "$identity"; then
            echo "::error::Identity '$identity' does not belong to team $APPLE_TEAM_ID."
            exit 1
          fi
          echo "Signing identity: $identity"

          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Write provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_DEVID_PROFILE_BASE64 }}
        run: |
          profile="$RUNNER_TEMP/devid.provisionprofile"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"
          echo "PROFILE_PATH=$profile" >> "$GITHUB_ENV"

      # Checks the profile (Developer ID, this app id, the keychain group, the signing certificate),
      # embeds it, signs Shared.framework and the app with hardened runtime and a timestamp, and
      # verifies the result.
      - name: Sign app
        run: |
          bash packaging/macos/sign-app.sh "$APP_PATH" "$SIGN_IDENTITY" "$PROFILE_PATH" \
            iosApp/iosApp/iosApp-macOS.entitlements "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Notarize and staple app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          bash packaging/macos/notarize-submission.sh "$APP_PATH" "$ASC_KEY_PATH" "$ASC_KEY_ID" "$ASC_ISSUER_ID"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Build DMG
        env:
          DMG_NAME: ${{ needs.build.outputs.dmg_name }}
        run: |
          DMG_PATH="$RUNNER_TEMP/dist/$DMG_NAME"
          bash packaging/macos/make-dmg.sh "$APP_PATH" "$DMG_PATH" "$DMG_VOLUME" "$SIGN_IDENTITY"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize and staple DMG
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          bash packaging/macos/notarize-submission.sh "$DMG_PATH" "$ASC_KEY_PATH" "$ASC_KEY_ID" "$ASC_ISSUER_ID"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"

      # The release workflow attaches the artifacts it names to the release, so the name is what it
      # was before this job moved here.
      - name: Upload DMG artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-macos
          path: ${{ env.DMG_PATH }}
          retention-days: ${{ inputs.retention-days || 14 }}

      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "${PROFILE_PATH:-}" "${ASC_KEY_PATH:-}" || true
