#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Dependency verification metadata (gradle/verification-metadata.xml) was generated on macOS
# arm64. Kotlin/Native toolchain artifacts differ per host OS, so Linux/Windows CI runners will
# hit checksums this file doesn't have yet. "lenient" warns instead of failing the build until
# a generation pass has run on ubuntu-latest and windows-latest too — then switch to "strict".
org.gradle.dependency.verification=lenient
# Build cache is disabled for reproducible builds.
# Enable locally for faster builds: org.gradle.caching=true
org.gradle.caching=false
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#Macos
org.jetbrains.compose.experimental.macos.enabled=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
