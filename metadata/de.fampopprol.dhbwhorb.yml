Name: DHBW Horb Student App
Summary: Timetable and Dualis grades app for DHBW Horb students
Description: |-
  Specially developed for students at DHBW Stuttgart Campus Horb.

  This app provides a complete overview of your daily study life:

  * Clear display of your personal timetable
  * All lectures, seminars and appointments at a glance
  * Easy navigation through the weekdays
  * Current information about room and lecturer
  * Access to your Dualis grades

