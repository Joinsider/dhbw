# --- SonarCloud project identity

sonar.projectKey=joinsider_dhbw
sonar.organization=joinsider
sonar.projectName=DHBW Horb Student App
sonar.projectVersion=1.0.13

# --- Source & binary paths ---
# All seven modules. This listed only composeApp until P9 — a leftover from before the module
# split, which meant Sonar had not looked at :domain, :data, :services or :presentation at all.
sonar.sources=\
  core/common/src/commonMain,\
  domain/src/commonMain,\
  data/src/commonMain,data/src/androidMain,data/src/desktopMain,data/src/iosMain,data/src/macosMain,\
  services/src/commonMain,services/src/androidMain,services/src/desktopMain,services/src/iosMain,services/src/macosMain,\
  presentation/src/commonMain,\
  shared/src/commonMain,shared/src/iosMain,\
  composeApp/src/commonMain,composeApp/src/androidMain,composeApp/src/desktopMain

sonar.tests=\
  core/testing/src/commonMain,\
  domain/src/commonTest,\
  data/src/commonTest,data/src/androidUnitTest,data/src/desktopTest,\
  services/src/commonTest,\
  presentation/src/commonTest,\
  composeApp/src/commonTest,composeApp/src/androidUnitTest,composeApp/src/desktopTest,composeApp/src/androidTest

sonar.java.binaries=\
  composeApp/build/tmp/kotlin-classes/debug,composeApp/build/classes/kotlin/desktop/main,\
  domain/build/tmp/kotlin-classes/debug,domain/build/classes/kotlin/desktop/main,\
  data/build/tmp/kotlin-classes/debug,data/build/classes/kotlin/desktop/main,\
  services/build/tmp/kotlin-classes/debug,services/build/classes/kotlin/desktop/main,\
  presentation/build/tmp/kotlin-classes/debug,presentation/build/classes/kotlin/desktop/main,\
  core/common/build/tmp/kotlin-classes/debug,core/common/build/classes/kotlin/desktop/main

# --- Language / encoding -----------------------------------------------------
sonar.language=kotlin
sonar.kotlin.source.version=2.2
sonar.sourceEncoding=UTF-8

# --- Coverage ----------------------------------------------------------------
# Kover outputs a JaCoCo-compatible XML report - SonarCloud reads it via this key.
sonar.coverage.jacoco.xmlReportPaths=composeApp/build/reports/kover/report.xml

# --- Exclusions --------------------------------------------------------------
sonar.exclusions=\
  **/build/**,\
  **/*.generated/**,\
  **/generated/**,\
  composeApp/build/generated/**,\
  **/resources/**,\
  **/*_Impl.kt,\
  **/*_Impl.java,\
  **/BuildConfig.kt,\
  **/*.pb.kt

sonar.coverage.exclusions=\
  **/test/**,\
  **/*Test*.kt,\
  **/*Test*.java,\
  **/build/**,\
  **/generated/**

