# --- SonarCloud project identity

sonar.projectKey=joinsider_dhbw
sonar.organization=joinsider
sonar.projectName=DHBW Horb Student App
sonar.projectVersion=1.0.13

# --- Source & binary paths ---
sonar.sources=composeApp/src/commonMain,composeApp/src/androidMain,composeApp/src/desktopMain
sonar.tests=composeApp/src/commonTest,composeApp/src/androidUnitTest,composeApp/src/desktopTest
sonar.java.binaries=composeApp/build/tmp/kotlin-classes/debug,composeApp/build/classes/kotlin/desktop/main

# --- Language / encoding -----------------------------------------------------
sonar.language=kotlin
sonar.kotlin.source.version=2.2
sonar.sourceEncoding=UTF-8

# --- Coverage ----------------------------------------------------------------
# Kover outputs a JaCoCo-compatible XML report - SonarCloud reads it via this key.
sonar.coverage.jacoco.xmlReportPaths=composeApp/build/reports/kover/report.xml

# --- Exclusions --------------------------------------------------------------
sonar.exclusions=\
  **/build/**,\
  **/*.generated/**,\
  **/generated/**,\
  composeApp/build/generated/**,\
  **/resources/**,\
  **/*_Impl.kt,\
  **/*_Impl.java,\
  **/BuildConfig.kt,\
  **/*.pb.kt

sonar.coverage.exclusions=\
  **/test/**,\
  **/*Test*.kt,\
  **/*Test*.java,\
  **/build/**,\
  **/generated/**

